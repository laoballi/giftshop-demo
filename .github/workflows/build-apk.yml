name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias hamer \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hamer2026 -keypass hamer2026 \
            -dname "CN=HamerGallery, OU=Shop, O=HamerGallery, L=Tehran, S=Tehran, C=IR"

      - name: Build release APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamerGallery-APK
          path: app/build/outputs/apk/release/app-release.apk
