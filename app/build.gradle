apply plugin: 'com.android.application'

android {
    namespace 'ir.hamergallery.app'
    compileSdk 34

    defaultConfig {
        applicationId "ir.hamergallery.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KS_PASS") ?: "hamer2026"
            keyAlias "hamer"
            keyPassword System.getenv("KS_PASS") ?: "hamer2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {}
